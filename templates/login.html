{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ - ระบบจัดการโครงการ{% endblock %}
{% block head %}
<style>
    .sidebar, .app-header, #project-workspace-tabs-bar {
        display: none !important;
    }
    .main-content {
        margin-left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        padding: 0 !important;
    }
    .content-wrapper {
        padding: 0 !important;
    }
</style>
{% endblock %}
{% block content %}
    <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 10% 20%, rgba(90, 142, 233, 0.15) 0%, rgba(104, 128, 207, 0.15) 90%), url('https://images.unsplash.com/photo-1581092918056-0c4c3acd3789?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover; z-index: 9999; display: flex; align-items: center; justify-content: center; font-family: 'Prompt', sans-serif;">
        <div style="background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(209, 213, 219, 0.3); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); display: flex; flex-direction: column; align-items: center;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 24px;">
                <img src="logo.png" alt="Logo" style="width: 50px; height: 50px; object-fit: contain;">
                <div style="display: flex; flex-direction: column;">
                    <span style="font-size: 16px; font-weight: 800; color: #1e3a8a; letter-spacing: -0.4px;">TECHNICAL WATER</span>
                    <span style="font-size: 9px; font-weight: 700; color: #475569; letter-spacing: 0.1px; text-transform: uppercase;">ENGINEERING & FACILITY</span>
                </div>
            </div>
            <h3 style="font-size: 18px; font-weight: 700; color: #1e293b; margin: 0 0 8px 0; text-align: center;">เข้าสู่ระบบจัดการโครงการ</h3>
            <p style="font-size: 12px; color: #64748b; margin: 0 0 24px 0; text-align: center; line-height: 1.5;">กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งาน</p>
            
            <form id="login-form" style="width: 100%; display: flex; flex-direction: column; gap: 16px;">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="login-username" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; background: rgba(255, 255, 255, 0.85); outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#1d4ed8'" onblur="this.style.borderColor='#cbd5e1'" placeholder="ระบุชื่อผู้ใช้งาน">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px;">
                    <label style="font-size: 12px; font-weight: 600; color: #475569;">รหัสผ่าน (Password)</label>
                    <input type="password" id="login-password" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; background: rgba(255, 255, 255, 0.85); outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#1d4ed8'" onblur="this.style.borderColor='#cbd5e1'" placeholder="กรอกรหัสผ่าน">
                </div>
                <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.2); transition: transform 0.1s, opacity 0.2s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'" onmouseover="this.style.opacity='0.95'" onmouseout="this.style.opacity='1'">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

{% endblock %}
